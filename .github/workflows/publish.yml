name: Publish @mrmx/chiqui to npm

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: `gh workflow run publish.yml --ref vX.Y.Z` — GITHUB_REF_NAME is the
  # dispatched ref (the tag), so the version guard below still applies.
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'mrmx/Chiqui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # npm Trusted Publisher (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0 —
      # bundled with Node 22. pnpm itself doesn't implement the OIDC exchange, so the
      # actual "Publish to npm" step below uses `npm publish`, not `pnpm publish`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./packages/chiqui/package.json').version")
          [ "v$PKG" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1; }

      - run: pnpm --filter '@mrmx/chiqui' check
      - run: pnpm --filter '@mrmx/chiqui' build

      # Node 22's bundled npm isn't guaranteed to be >= 11.5.1 (the actual minimum for
      # Trusted Publisher OIDC) -- force it explicitly rather than trust whatever shipped.
      - run: npm install -g npm@latest
      - run: npm --version

      # OIDC Trusted Publisher: no NPM_TOKEN. `npm publish` (not `pnpm publish` — pnpm
      # doesn't do the OIDC token exchange) picks it up automatically from id-token: write
      # above plus the Trusted Publisher configured on the npm package for this repo/workflow.
      - name: Publish to npm
        working-directory: packages/chiqui
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: success()
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "## @mrmx/chiqui@${VERSION}

          **npm:** [\`@mrmx/chiqui@${VERSION}\`](https://www.npmjs.com/package/@mrmx/chiqui/v/${VERSION})
          **Install:** \`npm install @mrmx/chiqui@${VERSION}\`" \
            || echo "Release already exists"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
