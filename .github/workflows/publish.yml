name: Publish @mrmx/chiqui to npm

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: `gh workflow run publish.yml --ref vX.Y.Z` — GITHUB_REF_NAME is the
  # dispatched ref (the tag), so the version guard below still applies.
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'mrmx/Chiqui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # pnpm >= 10.18 required for npm Trusted Publisher (OIDC) support.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./packages/chiqui/package.json').version")
          [ "v$PKG" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1; }

      - run: pnpm --filter '@mrmx/chiqui' check
      - run: pnpm --filter '@mrmx/chiqui' build

      # OIDC Trusted Publisher: no NPM_TOKEN. Requires the id-token: write permission
      # above and a Trusted Publisher configured on the npm package for this repo/workflow.
      - name: Publish to npm
        working-directory: packages/chiqui
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Create GitHub Release
        if: success()
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "## @mrmx/chiqui@${VERSION}

          **npm:** [\`@mrmx/chiqui@${VERSION}\`](https://www.npmjs.com/package/@mrmx/chiqui/v/${VERSION})
          **Install:** \`npm install @mrmx/chiqui@${VERSION}\`" \
            || echo "Release already exists"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
